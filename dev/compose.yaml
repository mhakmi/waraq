# A local Paperless-ngx for development and integration tests.
# It holds only synthetic documents. The credentials below are for this local server only.
name: waraq-dev

services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redis:/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-3.3.2}
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      # Set PAPERLESS_BIND=0.0.0.0 to let a phone on the same Wi-Fi reach this server.
      - "${PAPERLESS_BIND:-127.0.0.1}:${PAPERLESS_PORT:-8010}:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: waraq-dev-password
      PAPERLESS_SECRET_KEY: waraq-dev-secret-key-not-for-production
      PAPERLESS_URL: http://localhost:${PAPERLESS_PORT:-8010}
      PAPERLESS_TIME_ZONE: America/Toronto
      PAPERLESS_OCR_LANGUAGE: eng

volumes:
  redis:
  data:
  media:
