name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v0.3.1
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CHANGELOGS: fastlane/metadata/android/en-US/changelogs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tag matches the app version
        run: |
          version=$(sed -nE "s/^  version: '([^']+)',$/\1/p" app.config.ts)
          version_code=$(sed -nE 's/^    versionCode: ([0-9]+),$/\1/p' app.config.ts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match version $version in app.config.ts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      # The notes are read from the commit the workflow runs from, so a tag made before its notes
      # were written can still be released by hand from main.
      - name: Release notes exist
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          if ! git show "$GITHUB_SHA:$CHANGELOGS/$VERSION_CODE.txt" > "$RUNNER_TEMP/release/changes.txt"; then
            echo "::error::Write $CHANGELOGS/$VERSION_CODE.txt first"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: bun install --frozen-lockfile
      - run: CI=1 bunx expo prebuild --platform android --clean --no-install

      # Kept here and not in plugins/release-build.ts, so that tags made before this workflow
      # build the same set of APKs.
      - name: Build one APK per ABI and a universal one
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                      universalApk true
                  }
              }
          }
          EOF

      - name: Build
        working-directory: android
        run: |
          ./gradlew assembleRelease --console=plain
          ls -l app/build/outputs/apk/release/

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.WARAQ_SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.WARAQ_SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.WARAQ_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WARAQ_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no WARAQ_SIGNING_KEYSTORE_BASE64 secret. The build passed, and nothing was published."
            exit 1
          fi
          keystore=$RUNNER_TEMP/waraq-signing.jks
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          mkdir dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            abi=${abi#app-}
            "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "dist/waraq-$TAG-$abi.apk" "$apk"
          done
          rm "$keystore"
          "$apksigner" verify --print-certs "dist/waraq-$TAG-universal.apk" \
            | sed -nE 's/^Signer #1 certificate SHA-256 digest: //p' > "$RUNNER_TEMP/release/fingerprint.txt"
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$RUNNER_TEMP/release/notes.md
          {
            cat "$RUNNER_TEMP/release/changes.txt"
            echo
            echo "Waraq needs a Paperless-ngx 3.0 server or newer."
            echo
            echo "**Which file?** Most phones need \`waraq-$TAG-arm64-v8a.apk\`. The universal APK works on every phone and is larger."
            echo
            echo "**Check a download.** Run \`sha256sum -c SHA256SUMS --ignore-missing\`, and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` to see that this workflow built it."
            echo "The signing certificate's SHA-256 fingerprint is \`$(cat "$RUNNER_TEMP/release/fingerprint.txt")\`."
          } > "$notes"
          prerelease=
          case "$TAG" in
            v0.* | *-*) prerelease=--prerelease ;;
          esac
          gh release create "$TAG" dist/* --verify-tag --draft $prerelease \
            --title "Waraq $VERSION" --notes-file "$notes"
